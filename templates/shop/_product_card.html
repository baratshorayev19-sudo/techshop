<article class="product-card reveal">
    <a class="product-media" href="{% url 'shop:product_detail' product.slug %}">
        <img src="{{ product.image }}?v=20260512-9" alt="{{ product.name }}" loading="lazy">
        <span class="badge">{{ product.badge }}</span>
    </a>
    <form class="favorite-form" method="post" action="{% url 'shop:toggle_favorite' product.slug %}" data-favorite-form>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button class="favorite-btn {% if product.is_favorite %}active{% endif %}" type="submit" aria-label="{{ ui.favorites }}" data-favorite-button>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.8 5.6a5.4 5.4 0 0 0-7.6 0L12 6.8l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 22l8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"></path>
            </svg>
        </button>
    </form>
    <div class="product-body">
        <div class="product-meta">{{ product.brand }} &middot; {{ product.category_label }}</div>
        <h3><a href="{% url 'shop:product_detail' product.slug %}">{{ product.name }}</a></h3>
        <div class="rating" aria-label="{{ product.rating }} {{ ui.out_of_stars }}">
            <span>&#9733;</span>
            <b>{{ product.rating }}</b>
        </div>
        <div class="product-actions">
            <div class="price">
                <strong>{{ product.price_display }}</strong>
                <del>{{ product.old_price_display }}</del>
            </div>
            <form method="post" action="{% url 'shop:add_to_cart' product.slug %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.get_full_path }}">
                <button class="icon-btn" type="submit" aria-label="{{ ui.add_to_cart }}" {% if not product.stock.is_available %}disabled{% endif %}>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 4h2l2.2 10.3a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H6"></path>
                        <path d="M10 20h.01M18 20h.01"></path>
                    </svg>
                </button>
            </form>
        </div>
        <div class="product-card-foot">
            <span class="stock-dot {{ product.stock.level }}">{{ product.stock.label }}</span>
        </div>
        <form class="compare-form" method="post" action="{% url 'shop:toggle_compare' product.slug %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.get_full_path }}">
            <button class="{% if product.is_compared %}active{% endif %}" type="submit">
                {% if product.is_compared %}{{ ui.remove_from_compare }}{% else %}{{ ui.add_to_compare }}{% endif %}
            </button>
        </form>
    </div>
</article>
